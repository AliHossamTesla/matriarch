name: Idea or change
description: Suggest a new command, setting or change in behavior.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or missing today? A real example helps most.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you would solve it, and what it would cost (tokens, time, complexity).
