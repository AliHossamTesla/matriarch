name: Bug report
description: Something does not work as the documentation says.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected.
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool and version
      description: For example Claude Code 2.1.280, Codex, claude.ai.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of matriarch.py doctor
      description: Run python3 core/tools/matriarch.py doctor. Remove any path or name you do not want to share.
      render: json
