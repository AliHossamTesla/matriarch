[project]
name = "matriarch"
version = "0.3.0"
description = "Elephant-Goldfish workflow with shared project memory and independent, gated reviews."
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Matriarch ships instructions, not an importable package: install only the
# dependencies.
[tool.setuptools]
py-modules = []
