  if (!resetArmed) {
    slot.innerHTML = `<button class="small" id="reset-all"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true" style="vertical-align:-3px;margin-right:6px"><path d="M2.5 8a5.5 5.5 0 1 0 1.7-4M2.5 2.5v3h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Reset to defaults</button>`;
    slot.querySelector("#reset-all").onclick = () => { resetArmed = true; renderReset(slot); };
    if (resetDone) { slot.insertAdjacentHTML("afterbegin", `<span class="ok-t" role="status" style="margin-right:10px;font-size:13px">Back to the defaults.</span>`); resetDone = false; }
    return;
  }
  slot.innerHTML = `<div class="confirm" role="alertdialog" aria-label="Reset to defaults"><span>Reset every setting on every tab?</span><button class="small danger" id="reset-yes">Reset</button><button class="small" id="reset-no">Keep</button></div>`;
  slot.querySelector("#reset-yes").onclick = () => { resetArmed = false; state = fresh(); resetDone = true; changed(); };
  slot.querySelector("#reset-no").onclick = () => { resetArmed = false; renderReset(slot); };
}

// ------------------------------------------------------------------ frame
function renderSide() {
  const { errors, warnings } = check(), side = document.getElementById("side");
  const changedCount = (o) => (o ? JSON.stringify(o).match(/:/g)?.length || 0 : 0);
  side.innerHTML = `
    <div class="status big ${errors.length ? "bad" : "ok"}">
      <svg width="54" height="54" viewBox="0 0 58 58" aria-hidden="true"><circle cx="29" cy="29" r="25" fill="none" stroke="#262838" stroke-width="6"/><circle cx="29" cy="29" r="25" fill="none" stroke="${errors.length ? "#FF7A8A" : "#3DD6C1"}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${errors.length ? "60 157" : "157 157"}" transform="rotate(-90 29 29)"/></svg>
      <div><h3 class="${errors.length ? "bad-t" : "ok-t"}">${errors.length ? errors.length + (errors.length === 1 ? " problem" : " problems") : "Valid"}</h3>
      <div class="muted" style="font-size:12.5px">${errors.length ? "Fix them before you export." : "Schema and invariants pass."}</div></div></div>
    ${errors.length ? `<div class="status bad"><h3 class="bad-t">Fix before you save</h3><ul>${errors.map((e) => `<li>${esc(e)}</li>`).join("")}</ul></div>` : ""}
    ${warnings.length ? `<div class="status warn"><h3 class="warn-t">${warnings.length === 1 ? "1 warning" : warnings.length + " warnings"}</h3><ul>${warnings.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
    <div class="status"><h3>Changed from the defaults</h3><div class="muted">personal: ${changedCount(diff(Object.fromEntries(USER_KEYS.map((k) => [k, DATA.defaults[k]])), state.personal))} · projects: ${Object.keys(state.projects).length} · hub: ${changedCount(diff(DATA.defaults.project, state.project))}</div></div>
    <div class="muted" style="font-size:12px">Final check before you use them: <code>matriarch.py config</code> (also checks folders and git repositories).</div>`;
}
function render() {
  syncs = [];
  const nav = document.getElementById("nav"), main = document.getElementById("main");
  nav.innerHTML = ""; for (const [id, name] of TABS) { const b = document.createElement("button"); b.textContent = name; b.className = id === tab ? "on" : ""; b.onclick = () => { tab = id; render(); }; nav.appendChild(b); }
  const t = TABS.find((x) => x[0] === tab);
  main.innerHTML = `<div class="pagehead"><div><h2>${t[1]}</h2><p class="lead">${esc(t[2])}</p></div><div id="reset-slot"></div></div>`;
  renderReset(main.querySelector("#reset-slot"));
  ({ personal: renderPersonal, projects: renderProjects, project: renderProject, preview: renderPreview, io: renderIO })[tab](main);
  renderSide();
}
let syncs = [];
function changed() { for (const s of syncs) s(); save(); const y = window.scrollY; render(); window.scrollTo(0, y); }
load(); render();
</script>
</body>
